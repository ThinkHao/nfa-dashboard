version: "3.8"

services:
  backend:
    image: ghcr.io/${REGISTRY_OWNER}/nfa-dashboard-backend:${IMAGE_TAG}
    container_name: nfa-backend
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - APP_PORT=${APP_PORT:-8081}
      - TRAFFIC_REPORT_STORAGE_DIR=${TRAFFIC_REPORT_STORAGE_DIR:-/app/storage/traffic-reports}
      - TRAFFIC_REPORT_LEGACY_BASE_URL=${TRAFFIC_REPORT_LEGACY_BASE_URL:-}
      - TRAFFIC_REPORT_LEGACY_API_KEY=${TRAFFIC_REPORT_LEGACY_API_KEY:-}
      - TRAFFIC_REPORT_LEGACY_NATIVE_ENABLED=${TRAFFIC_REPORT_LEGACY_NATIVE_ENABLED:-false}
      - TRAFFIC_REPORT_EDC_HOST=${TRAFFIC_REPORT_EDC_HOST:-}
      - TRAFFIC_REPORT_EDC_PORT=${TRAFFIC_REPORT_EDC_PORT:-3306}
      - TRAFFIC_REPORT_EDC_USER=${TRAFFIC_REPORT_EDC_USER:-}
      - TRAFFIC_REPORT_EDC_PASSWORD=${TRAFFIC_REPORT_EDC_PASSWORD:-}
      - TRAFFIC_REPORT_EDC_DB=${TRAFFIC_REPORT_EDC_DB:-cloud}
      - TRAFFIC_REPORT_EDC_TABLE=${TRAFFIC_REPORT_EDC_TABLE:-edc_data}
      - TRAFFIC_REPORT_EDC_TIME_COLUMN=${TRAFFIC_REPORT_EDC_TIME_COLUMN:-create_time}
      - TRAFFIC_REPORT_EDC_NAME_COLUMN=${TRAFFIC_REPORT_EDC_NAME_COLUMN:-edc_name}
      - TRAFFIC_REPORT_EDC_VALUE_COLUMN=${TRAFFIC_REPORT_EDC_VALUE_COLUMN:-service_size}
      - TRAFFIC_REPORT_EDC_EXCLUDE_LIKE=${TRAFFIC_REPORT_EDC_EXCLUDE_LIKE:-%-backup}
      - TRAFFIC_REPORT_EDC_WILDCARD_MODE=${TRAFFIC_REPORT_EDC_WILDCARD_MODE:-prefix}
      - TRAFFIC_REPORT_EDC_DAILY_RANK_INDEX=${TRAFFIC_REPORT_EDC_DAILY_RANK_INDEX:-14}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_ACCESS_TOKEN_TTL_MINUTES=${AUTH_ACCESS_TOKEN_TTL_MINUTES:-60}
      - AUTH_REFRESH_TOKEN_TTL_MINUTES=${AUTH_REFRESH_TOKEN_TTL_MINUTES:-43200}
      - BINDING_ALLOWED_SALES_ROLES=${BINDING_ALLOWED_SALES_ROLES}
      - BINDING_ALLOWED_LINE_ROLES=${BINDING_ALLOWED_LINE_ROLES}
      - BINDING_ALLOWED_NODE_ROLES=${BINDING_ALLOWED_NODE_ROLES}
      - BINDING_ALLOWED_CHANNEL_ROLES=${BINDING_ALLOWED_CHANNEL_ROLES}
      - RATES_OWNER_ROLES_CUSTOMER_FEE=${RATES_OWNER_ROLES_CUSTOMER_FEE}
      - RATES_OWNER_ROLES_NETWORK_LINE_FEE=${RATES_OWNER_ROLES_NETWORK_LINE_FEE}
    ports:
      - "${APP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - nfa_net

  frontend:
    image: ghcr.io/${REGISTRY_OWNER}/nfa-dashboard-frontend:${IMAGE_TAG}
    container_name: nfa-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nfa_net

networks:
  nfa_net:
    driver: bridge
