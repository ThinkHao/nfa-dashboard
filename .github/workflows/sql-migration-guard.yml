name: SQL Migration Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-sql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nfa_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Validate SQL migration layout
        run: python scripts/sql_migration_guard.py check

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke test install_full plus incremental migrations
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot nfa_ci < sql/dist/install_full.sql
          for file in $(find sql/migrations -maxdepth 1 -type f -name '*.sql' | sort -V); do
            echo "Applying ${file}"
            mysql -h 127.0.0.1 -P 3306 -uroot -proot nfa_ci < "${file}"
          done
