name: SQL Migration Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-sql-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate SQL migration layout
        run: python scripts/sql_migration_guard.py check
